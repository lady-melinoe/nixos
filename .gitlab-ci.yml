workflow:
  rules:
    - if: '$CI_SERVER_HOST == "gitlab.melinoe.net"'
    - when: never

stages:
  - validate
  - deploy

validate:
  stage: validate

  tags:
    - deployments

  script:
    - nix flake check --no-build

deploy:
  stage: deploy
  resource_group: production

  tags:
    - deployments

  rules:
    # Trigger on [DEPLOY] (all nodes) or [DEPLOY <host>] (specific node).
    # The node list is resolved inside mel-deploy at runtime from the flake —
    # no need to maintain it here.
    - if: '$CI_COMMIT_MESSAGE =~ /\[DEPLOY/'
      when: on_success
    - when: never

  script:
    - nix run .#mel-deploy -- "$CI_COMMIT_MESSAGE"
